# Disk usage
#
# The directory defaults to $HOME if the instance is not specified.
# The script may be called with a optional argument to set the alert
# (defaults to 10 for 10%).
[disk]
label=<span color='#cba6f7'></span> 
instance=/
command=~/.config/i3/scripts/disk
interval=30

[disk]
label=<span color='#cba6f7'></span> 
instance=/home
command=~/.config/i3/scripts/disk
interval=30

# Memory usage
#
# The type defaults to "mem" if the instance is not specified.
[memory]
label=<span color='#cba6f7'></span> 
command=~/.config/i3/scripts/memory
interval=2

[cpu_usage]
label=<span color='#cba6f7'></span> 
command=~/.config/i3/scripts/cpu_usage
#min_width=CPU: 100.00%
interval=2

[CPU-temperature]
label=
command=~/.config/i3/scripts/temperature --chip coretemp-isa-0000
# command=~/.config/i3/scripts/temperature --chip acpitz-acpi-0
interval=2
#T_WARN=70
#T_CRIT=90
#SENSOR_CHIP=""
# where SENSOR_CHIP can be find with sensors output
# can be used also for GPU temperature or other temperature sensors lm-sensors detects.

[bandwidth]
command=~/.config/i3/scripts/bandwidth2
interval=persist

[load_average]
label=<span color='#cba6f7'></span>
command=cat /proc/loadavg | awk '{print " " $1}'
interval=5
markup=pango

[fan]
label=<span color='#cba6f7'></span>
interval=5
command=cat /sys/class/hwmon/hwmon*/fan1_input 2>/dev/null | head -1 | awk '{print " " $1 " RPM"}'

[frequancy]
label=<span color='#cba6f7'></span> 
interval=5
#command=grep "cpu MHz" /proc/cpuinfo |cut -d ":" -f 2 | cut -d "." -f1 | head -1 | sed 's/$/ MHz/'
command=stdbuf -oL awk '/cpu MHz/ {sum+=$4; c++} END {printf "%d\n", sum/c}' /proc/cpuinfo

