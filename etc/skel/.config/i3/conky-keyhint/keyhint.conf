-- Keybinding cheat sheet, toggled by ~/.config/i3/scripts/keyhint-toggle ($mod+F1 or the bar button).
-- TEMPLATE: scripts/keyhint-gen fills the @...@ placeholders from the i3 config and the active theme
-- and writes the result to ~/.cache/i3-keyhint/keyhint.conf. Edit the look here.
conky.config = {
    own_window = true,
    own_window_type = 'normal',
    own_window_hints = 'undecorated,sticky,skip_taskbar,skip_pager',
    own_window_class = 'keyhint-conky',
    own_window_title = 'keyhint-conky',
    own_window_argb_visual = true,
    own_window_argb_value = 245,
    own_window_transparent = false,
    own_window_colour = '@BG@',

    alignment = 'middle_middle',
    gap_x = 0,
    gap_y = 0,
    minimum_width = @WIDTH@,
    maximum_width = @WIDTH@,
    border_inner_margin = 34,

    use_xft = true,
    font = 'Noto Sans:size=10',
    default_color = '@FG@',
    color1 = '@ACCENT@',
    color2 = '@MUTED@',
    color3 = '@FG@',
    color4 = '@SEP@',

    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,
    double_buffer = true,
    update_interval = 3600,
    background = false,
    out_to_console = false,
    out_to_x = true,
    text_buffer_size = 32768,
}

conky.text = [==[
@TEXT@]==]
