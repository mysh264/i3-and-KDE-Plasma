# Animations
transition-length = 50
transition-pow-x = 0.1
transition-pow-y = 0.1
transition-pow-w = 0.1
transition-pow-h = 0.1
size-transition = true

# Rounded Corners
corner-radius = 10;
rounded-corners-exclude = [
  #"window_type = 'normal'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'i3-frame'",
  "class_g = 'i3bar'",
  #"class_g = 'plasmashell'"

  # 1. Fix for Single Window/Dock Mode:
  # Excludes windows that are effectively "maximized" (full width).
  # If you use a side bar, adjust 'width' accordingly.
  "width >= 1900 && !I3_FLOATING_WINDOW",

  # 2. Standard Exclusions
  "_NET_WM_STATE *= '_NET_WM_STATE_FULLSCREEN'",
  "_NET_WM_STATE *= '_NET_WM_STATE_MAXIMIZED_VERT'",
  "_NET_WM_STATE *= '_NET_WM_STATE_MAXIMIZED_HORZ'",
  "_NET_WM_STATE *= '_NET_WM_STATE_HIDDEN'",
  #"_NET_WM_STATE@[*] *= '_NET_WM_STATE_FOCUSED'", # if you activate it, the floating window will not round
  #"_GTK_FRAME_EXTENTS",
];

# If you want to make a special rules for corner use it:
#corner-radius-rules = [
#  "15:_NET_WM_STATE@[*] *= '_NET_WM_STATE_FOCUSED'", # if you will activate it, remove it from rounded-corners-exclude
#];

round-borders = 0;

# Shadows
shadow = false;
shadow-radius = 2;
shadow-opacity = 1;
shadow-offset-x = -7;
shadow-offset-y = -7;
# no-dock-shadow = false
# no-dnd-shadow = false
# shadow-red = 0
# shadow-green = 0
# shadow-blue = 0
# shadow-ignore-shaped = ''
# shadow-exclude = []
shadow-exclude = [
  "class_g = 'Conky'",
  "class_g = 'firefox' && argb",
  "class_g = 'i3-frame'",
  "argb && (override_redirect || wmwin)",
  "class_g ?= 'Peek'",
  "class_g = 'kscreen_osd_service'",
  "_NET_WM_STATE@[*] *= '_NET_WM_STATE_FULLSCREEN'",
  "_NET_WM_STATE@[*] *= '_NET_WM_STATE_MAXIMIZED_VERT'",
  "_NET_WM_STATE@[*] *= '_NET_WM_STATE_MAXIMIZED_HORZ'",
  "_NET_WM_STATE@[*] *= '_NET_WM_STATE_HIDDEN'",
];
shadow-exclude-reg = [
"class_g = * && argb",
];

# Fading
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
# fade-delta = 10
fade-exclude = [
];
# no-fading-openclose = false
# no-fading-destroyed-argb = false

# Transparency / Opacity
# inactive-opacity = 1
inactive-opacity = 0.9;
frame-opacity = 0.7;
#menu-opacity = 0.7 # Used down "window_type"
#popup_menu = { opacity = 0.8; } # Used down "window_type"
#dropdown_menu = { opacity = 0.8; } # Used down "window_type"
notification = { opacity = 0.5; }
inactive-opacity-override = false;
active-opacity = 1.0;
inactive-dim = 0.2
focus-exclude = [
];
# inactive-dim-fixed = 1.0
opacity-rule = [
  "0:_NET_WM_STATE@[*] *= '_NET_WM_STATE_HIDDEN'",
  #"100:class_g    = 'XTerm'",
  #"100:class_g    = 'URxvt'",
  #"100:class_g    = 'Meld'",
  #"95:class_g     = 'TelegramDesktop'",
  #"95:class_g     = 'jetbrains-clion'",
  #"95:class_g     = 'discord'",
  #"90:class_g     = 'Joplin'",
  "80:class_g     = 'Xfce4-terminal'",
  "80:class_g     = 'konsole'",
  "70:class_g     = 'i3-frame'",
  "70:class_g     = 'i3bar'",
  "90:class_g     = 'kitty'",
  #"95:class_g    = 'firefox'",
  #"95:class_g    = 'Thunderbird'",
];


# Background-Blurring
# blur-method =
# blur-size = 12
# blur-deviation = false
# blur-background = true;
# blur-background-frame = false;
# blur-background-fixed = false;
# blur-kern = ''
# blur-kern = "3x3box";
blur: {
  # requires: https://github.com/ibhagwan/picom
  method = "dual_kawase";
  strength = 2;
  deviation = 0.0;
  kernel = "11x11gaussian";
  background = false;
  background-frame = false;
  background-fixed = false;
  kern = "3x3box";
}
blur-background-exclude = [
    "_NET_WM_STATE@[*] *= '_NET_WM_STATE_HIDDEN'",
    "class_g = 'kscreen_osd_service'",
    "class_g = 'Peek'",
];
# daemon = false
experimental-backends = true;
backend = "glx";
vsync = true
# dbus = false
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
#refresh-rate = 0
# sw-opti =
# use-ewmh-active-win = false;
unredir-if-possible = false;
# unredir-if-possible-delay = 0
# unredir-if-possible-exclude = []
detect-transient = true
detect-client-leader = true
# resize-damage = 1
# invert-color-include = []
# glx-no-stencil = false
# glx-no-rebind-pixmap = false
# no-use-damage = false
use-damage = false
# xrender-sync-fence = false
# glx-fshader-win = ''
# force-win-blend = false
# no-ewmh-fullscreen = false
# max-brightness = 1.0
# transparent-clipping = false
log-level = "info";
# log-file = '/path/to/your/log/file'
# show-all-xerrors = false
# write-pid-path = '/path/to/your/log/file'
# Window type settings
wintypes:
{
  normal = { fade = false; shadow = false; };
  tooltip = { fade = true; shadow = false; opacity = 0.75; focus = true; full-shadow = false; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  menu = { shadow = false; blur-background = false; opacity = 0.8; };
  popup_menu = { shadow = false; blur-background = false; opacity = 0.8; };
  dropdown_menu = { shadow = false; blur-background = false; opacity = 0.8; };
};
