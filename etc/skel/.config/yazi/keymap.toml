# [Mount](https://github.com/yazi-rs/plugins/tree/main/mount.yazi)
[[mgr.prepend_keymap]]
on  = "M"
run = "plugin mount"

# [Zoom](https://github.com/yazi-rs/plugins/tree/main/zoom.yazi) 
[[mgr.prepend_keymap]]
on   = "+"
run  = "plugin zoom 1"
desc = "Zoom in hovered file"

[[mgr.prepend_keymap]]
on   = "-"
run  = "plugin zoom -1"
desc = "Zoom out hovered file"

# [Chmod](https://github.com/yazi-rs/plugins/tree/main/chmod.yazi)
[[mgr.prepend_keymap]]
on   = [ "e", "E" ]
run  = "plugin chmod"
desc = "Chmod on selected files"

# [DIFF](https://github.com/yazi-rs/plugins/tree/main/diff.yazi)
[[mgr.prepend_keymap]]
on   = "<C-d>"
run  = "plugin diff"
desc = "Diff the selected with the hovered file"

# [Smart Enter](https://github.com/yazi-rs/plugins/tree/main/smart-enter.yazi)
[[mgr.prepend_keymap]]
on   = "<Enter>"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

# [Toggle Pane](https://github.com/yazi-rs/plugins/tree/main/toggle-pane.yazi)
[[mgr.prepend_keymap]]
on   = "p"
run  = "plugin toggle-pane min-preview"
desc = "Show or hide the preview pane"

[[mgr.prepend_keymap]]
on   = "P"
run  = "plugin toggle-pane max-preview"
desc = "Maximize or restore the preview pane"

# [VCS Files](https://github.com/yazi-rs/plugins/tree/main/vcs-files.yazi)
[[mgr.prepend_keymap]]
on   = [ "g", "c" ]
run  = "plugin vcs-files"
desc = "Show Git file changes"
